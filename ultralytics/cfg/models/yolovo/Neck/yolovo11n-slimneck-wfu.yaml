# YOLOVO11n with SlimNeck+WFU - Open-vocabulary multimodal detection model
# Architecture: YOLO11 backbone + WFU wavelet-based fusion + SlimNeck (VoVGSCSP+GSConv) + VCTE + YOLOVODetect
# WFU: Wavelet Feature Union, replaces Upsample+Concat with Haar wavelet weighted fusion
# SlimNeck paper: GSConv (arXiv 2206.02424)

nc: 80
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem
  - [-1, 1, Conv, [128, 3, 2]]             # 1
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 11 - text input socket
  - [11, 1, VCTETextAdapter, []]             # 12 - text adapter
  - [10, 1, VCTEVisualAdapter, []]           # 13 - visual context from backbone
  - [[12, 13], 1, VCTETextEnhancer, []]      # 14 - text-visual fusion

head:
  # WFU-based top-down path + SlimNeck (GSConv + VoVGSCSP)
  # WFU P4 scale: x_big=P4_skip(6), x_small=P5_skip(10)
  - [[6, 10], 1, WFU, []]                       # 15 - WFU(P4_skip, P5_skip)
  - [-1, 2, VoVGSCSP, [512]]                     # 16

  # WFU P3 scale: x_big=P3_skip(4), x_small=P4_proc(16)
  - [[4, 16], 1, WFU, []]                         # 17 - WFU(P3_skip, P4_proc)
  - [-1, 2, VoVGSCSP, [256]]                     # 18 - P3/8-small (WFU+SlimNeck)

  # Bottom-up PAN (GSConv downsample + Concat)
  - [-1, 1, GSConv, [256, 3, 2]]                 # 19
  - [[-1, 16], 1, Concat, [1]]                   # 20
  - [-1, 2, VoVGSCSP, [512]]                     # 21 - P4/16-medium (WFU+SlimNeck)

  - [-1, 1, GSConv, [512, 3, 2]]                 # 22
  - [[-1, 10], 1, Concat, [1]]                   # 23
  - [-1, 2, VoVGSCSP, [1024]]                    # 24 - P5/32-large (WFU+SlimNeck)

  - [[18, 14], 1, VCTENeckModulator, []]         # 25 - enhanced P3
  - [[21, 14], 1, VCTENeckModulator, []]         # 26 - enhanced P4
  - [[24, 14], 1, VCTENeckModulator, []]         # 27 - enhanced P5
  - [[25, 26, 27, 14], 1, YOLOVODetect, []]      # 28 - open-vocab detection head
