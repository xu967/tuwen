# YOLOVO11n with SOEP Neck - Open-vocabulary multimodal detection model
# Architecture: YOLO11 backbone + SOEP-enhanced neck (SPDConv+CSPOmniKernel) + VCTE + YOLOVODetect
# SOEP: Small Object Enhance Pyramid, uses P2 features to boost P3 small-object detection
# Important: Requires amp=False and half=False for training/validation

nc: 80
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem (P1/2)
  - [-1, 1, Conv, [128, 3, 2]]             # 1 (P2/4)
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2 (P2_feat)
  - [-1, 1, Conv, [256, 3, 2]]             # 3 (P3/8)
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4 (P3_feat)
  - [-1, 1, Conv, [512, 3, 2]]             # 5 (P4/16)
  - [-1, 2, C3k2, [512, True]]             # 6 (P4_feat)
  - [-1, 1, Conv, [1024, 3, 2]]            # 7 (P5/32)
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10 (P5_feat)

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 11 - text input socket
  - [11, 1, VCTETextAdapter, []]             # 12 - text adapter
  - [10, 1, VCTEVisualAdapter, []]           # 13 - visual context from backbone
  - [[12, 13], 1, VCTETextEnhancer, []]      # 14 - text-visual fusion

head:
  # SOEP-enhanced neck: standard FPN + P2-level SOEP enhancement + standard PAN
  # Standard FPN
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]       # 15 - P5 up
  - [[-1, 6], 1, Concat, [1]]                         # 16
  - [-1, 2, C3k2, [512, False]]                       # 17 - FPN P4

  # SOEP P2-level small object enhancement
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]        # 18 - up to P3 scale
  - [2, 1, SPDConv, [256]]                            # 19 - SPDConv on P2_feat(2)
  - [[-1, -2, 4], 1, Concat, [1]]                     # 20 - SPDConv + FPN_up + P3_skip
  - [-1, 1, CSPOmniKernel, []]                        # 21 - multi-scale kernel fusion
  - [-1, 2, C3k2, [256, False]]                       # 22 - P3/8-small (SOEP-enhanced)

  # PAN (standard)
  - [-1, 1, Conv, [256, 3, 2]]                        # 23
  - [[-1, 17], 1, Concat, [1]]                        # 24
  - [-1, 2, C3k2, [512, False]]                       # 25 - P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                        # 26
  - [[-1, 10], 1, Concat, [1]]                        # 27
  - [-1, 2, C3k2, [1024, True]]                       # 28 - P5/32-large

  - [[22, 14], 1, VCTENeckModulator, []]              # 29 - enhanced P3
  - [[25, 14], 1, VCTENeckModulator, []]              # 30 - enhanced P4
  - [[28, 14], 1, VCTENeckModulator, []]              # 31 - enhanced P5
  - [[29, 30, 31, 14], 1, YOLOVODetect, []]           # 32 - open-vocab detection head
