# YOLOVO11n with MSIA Neck - Open-vocabulary multimodal detection model
# Architecture: YOLO11 backbone + MSIA-enhanced FPN + VCTE text enhancement + YOLOVODetect
# MSIA: Multiscale Iterative Aggregation, replaces Concat with iterative attention fusion
# Important: Training with MSIA requires amp=False to avoid NaN loss

nc: 80
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem
  - [-1, 1, Conv, [128, 3, 2]]             # 1
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 11 - text input socket
  - [11, 1, VCTETextAdapter, []]             # 12 - text adapter
  - [10, 1, VCTEVisualAdapter, []]           # 13 - visual context from backbone
  - [[12, 13], 1, VCTETextEnhancer, []]      # 14 - text-visual fusion

head:
  # MSIA-enhanced FPN + standard PAN
  # P4 level: MSIA(P4_skip, P5_up_aligned)
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]       # 15 - P5 up to P4 scale
  - [-1, 1, Conv, [512, 1, 1]]                       # 16 - channel align P5_up -> 512
  - [[6, 16], 1, MSIA, [512]]                        # 17 - MSIA(P4_skip=512, P5_up=512)
  - [-1, 2, C3k2, [512, False]]                      # 18

  # P3 level: MSIA(P3_skip, P4_proc_up_aligned)
  - [18, 1, nn.Upsample, [None, 2, "nearest"]]       # 19 - P4_proc up to P3 scale
  - [-1, 1, Conv, [512, 1, 1]]                       # 20 - channel align P4_up -> 512
  - [[4, 20], 1, MSIA, [512]]                        # 21 - MSIA(P3_skip=512, P4_up=512)
  - [-1, 2, C3k2, [256, False]]                      # 22 - P3/8-small (MSIA-enhanced)

  # PAN (standard Concat)
  - [-1, 1, Conv, [256, 3, 2]]                       # 23
  - [[-1, 18], 1, Concat, [1]]                       # 24
  - [-1, 2, C3k2, [512, False]]                      # 25 - P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                       # 26
  - [[-1, 10], 1, Concat, [1]]                       # 27
  - [-1, 2, C3k2, [1024, True]]                      # 28 - P5/32-large

  - [[22, 14], 1, VCTENeckModulator, []]             # 29 - enhanced P3
  - [[25, 14], 1, VCTENeckModulator, []]             # 30 - enhanced P4
  - [[28, 14], 1, VCTENeckModulator, []]             # 31 - enhanced P5
  - [[29, 30, 31, 14], 1, YOLOVODetect, []]          # 32 - open-vocab detection head
