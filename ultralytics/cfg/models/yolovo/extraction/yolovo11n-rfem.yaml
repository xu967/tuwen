# YOLOVO11n with RFEM - Open-vocabulary multimodal detection model
# RFEM replaces the layer before SPPF for expanded receptive field
# Note: RFEM requires amp=False during training

nc: 80
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem
  - [-1, 1, Conv, [128, 3, 2]]             # 1
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, RFEM, [1024]]                  # 9 - RFEM receptive field expansion
  - [-1, 1, SPPF, [1024, 5]]               # 10
  - [-1, 2, C2PSA, [1024]]                 # 11

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 12 - text input socket
  - [12, 1, VCTETextAdapter, []]             # 13 - text adapter
  - [11, 1, VCTEVisualAdapter, []]           # 14 - visual context from backbone (C2PSA=11)
  - [[13, 14], 1, VCTETextEnhancer, []]      # 15 - text-visual fusion

head:
  - [11, 1, nn.Upsample, [None, 2, "nearest"]]    # 16 - upsample from P5
  - [[-1, 6], 1, Concat, [1]]                      # 17 - concat with P4(6)
  - [-1, 2, C3k2, [512, False]]                    # 18
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 19
  - [[-1, 4], 1, Concat, [1]]                      # 20 - concat with P3(4)
  - [-1, 2, C3k2, [256, False]]                    # 21 - P3
  - [-1, 1, Conv, [256, 3, 2]]                     # 22
  - [[-1, 18], 1, Concat, [1]]                     # 23
  - [-1, 2, C3k2, [512, False]]                    # 24 - P4
  - [-1, 1, Conv, [512, 3, 2]]                     # 25
  - [[-1, 11], 1, Concat, [1]]                     # 26 - concat with P5(11)
  - [-1, 2, C3k2, [1024, True]]                    # 27 - P5
  - [[21, 15], 1, VCTENeckModulator, []]           # 28 - enhanced P3
  - [[24, 15], 1, VCTENeckModulator, []]           # 29 - enhanced P4
  - [[27, 15], 1, VCTENeckModulator, []]           # 30 - enhanced P5
  - [[28, 29, 30, 15], 1, YOLOVODetect, []]        # 31 - open-vocab detection head
