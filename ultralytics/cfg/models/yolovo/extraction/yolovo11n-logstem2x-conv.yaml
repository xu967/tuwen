# YOLOVO11n with LoGStem2x Conv Replacement - Open-vocabulary multimodal detection model
# LoGStem2x replaces all intermediate downsampling Conv layers for edge-enhanced feature extraction
# Layer 0 (stem Conv) remains standard; layers 1, 3, 5, 7 use LoGStem2x

nc: 80
text_encoder:
  name: mobileclip_s0
  dim: 512

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 - stem
  - [-1, 1, LoGStem2x, [128]]              # 1 - LoGStem2x replaces Conv
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, LoGStem2x, [256]]              # 3 - LoGStem2x replaces Conv
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, LoGStem2x, [512]]              # 5 - LoGStem2x replaces Conv
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, LoGStem2x, [1024]]             # 7 - LoGStem2x replaces Conv
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

text:
  - [-1, 1, VCTETextInput, [], "text"]       # 11 - text input socket
  - [11, 1, VCTETextAdapter, []]             # 12 - text adapter
  - [10, 1, VCTEVisualAdapter, []]           # 13 - visual context from backbone
  - [[12, 13], 1, VCTETextEnhancer, []]      # 14 - text-visual fusion

head:
  - [10, 1, nn.Upsample, [None, 2, "nearest"]]    # 15
  - [[-1, 6], 1, Concat, [1]]                      # 16
  - [-1, 2, C3k2, [512, False]]                    # 17
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 18
  - [[-1, 4], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [256, False]]                    # 20 - P3
  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 17], 1, Concat, [1]]                     # 22
  - [-1, 2, C3k2, [512, False]]                    # 23 - P4
  - [-1, 1, Conv, [512, 3, 2]]                     # 24
  - [[-1, 10], 1, Concat, [1]]                     # 25
  - [-1, 2, C3k2, [1024, True]]                    # 26 - P5
  - [[20, 14], 1, VCTENeckModulator, []]           # 27 - enhanced P3
  - [[23, 14], 1, VCTENeckModulator, []]           # 28 - enhanced P4
  - [[26, 14], 1, VCTENeckModulator, []]           # 29 - enhanced P5
  - [[27, 28, 29, 14], 1, YOLOVODetect, []]        # 30 - open-vocab detection head
